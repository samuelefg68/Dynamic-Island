<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Dinamic Island</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
</head>
<body>
    <div class="mensagem"> <button onclick="plim()">Notificação</button>
    </div>
    <main class="principal"> 
        
        
        <div class="notch" id="island">
            <div class="verde"></div>
            <img src="./luz2.svg" alt="" class="aparece">
        </div>
        
        <div class="icons">

            <button class="flash" id="lampada" onclick="liga()"> 
                <img src="./luz.svg" alt="" class="luz">
            </button>

            <button class="camera" onclick="acende()" id="cam">
                <img src="./camera-solid-full.svg" alt="" class="foto">
            </button> 
            
        </div>
        <p class="legenda">Swipe To Unlock</p>
        <div class="touch"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
